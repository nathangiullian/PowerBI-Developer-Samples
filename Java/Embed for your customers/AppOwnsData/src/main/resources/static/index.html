<!DOCTYPE html>
<html lang="en">
<head>
    <title>Embedded Power BI report</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px 20px;
            font-size: 1.2em;
        }
        main {
            display: flex;
            height: calc(100% - 120px);
            padding: 20px;
        }
        #text-container {
            flex: 0 0 300px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
            margin-right: 20px;
        }
        #report-container {
            flex: 1;
            min-height: 500px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .visual-container {
            min-height: 300px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 10px;
        }
        .error-container {
            display: none;
            padding: 20px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            color: #721c24;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <header>
        Power BI Embedded Sample
    </header>
    <main class="row">
        <section id="text-container">
            <div>
                <p>This sample demonstrates embedding Power BI visuals using Spring Boot.</p>
                <p>Embedded Power BI visual with Row-Level Security.</p>
            </div>
        </section>
        <div style="flex: 1; display: flex; flex-wrap: wrap;">
            <div id="visual-container-1" class="visual-container" style="flex: 1; min-width: 400px;"></div>
        </div>
        <section class="error-container"></section>
    </main>
    <footer>
        For Live demo and more code samples please visit
        <a href="https://aka.ms/EmbeddedPlayground">https://aka.ms/EmbeddedPlayground</a>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.22.0/dist/powerbi.min.js"></script>

    <script>
        $(function () {
            var models = window['powerbi-client'].models;

            // Define the visuals you want to embed
            // You'll need to get these values from your Power BI report
            // See instructions below on how to find pageName and visualName
            var visualsToEmbed = [
                {
                    containerId: "visual-container-1",
                    pageName: "c16e63727a3151412611",
                    visualName: "0c399b8a4831f39005a3"
                }
            ];

            // Request to get embed details
            $.ajax({
                type: "GET",
                url: "/getembedinfo",
                dataType: "json",
                success: function (embedData) {

                    // Embed each visual
                    visualsToEmbed.forEach(function(visualConfig) {
                        var container = document.getElementById(visualConfig.containerId);

                        var visualEmbedConfig = {
                            type: "visual",
                            tokenType: models.TokenType.Embed,
                            accessToken: embedData.embedToken,
                            embedUrl: embedData.embedReports[0].embedUrl,
                            pageName: visualConfig.pageName,
                            visualName: visualConfig.visualName,
                            settings: {
                                filterPaneEnabled: false,
                                navContentPaneEnabled: false
                            }
                        };

                        var visual = powerbi.embed(container, visualEmbedConfig);

                        visual.on("loaded", function () {
                            console.log("Visual loaded: " + visualConfig.visualName);
                        });

                        visual.on("error", function (event) {
                            console.error("Visual error:", event.detail);
                        });
                    });
                },
                error: function (err) {
                    // Show error container
                    $("#text-container").hide();
                    $(".visual-container").hide();
                    var errorContainer = $(".error-container");
                    errorContainer.show();

                    var errMessageHtml = "<strong>Error Details:</strong><br/>";
                    errMessageHtml += err.responseText ? err.responseText.split("\n").join("<br/>") : "Unknown error";
                    errorContainer.html(errMessageHtml);
                }
            });
        });
    </script>
</body>
</html>
